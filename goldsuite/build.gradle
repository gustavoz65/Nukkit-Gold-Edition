allprojects {
    group = 'br.goldsuite'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
    }
    dependencies {
        compileOnly files(rootProject.file('../build/nukkit-gold.jar'))
        testImplementation files(rootProject.file('../build/nukkit-gold.jar'))
    }
    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

project(':gold-core') {
    dependencies {
        implementation project(':gold-api')
        implementation files(rootProject.file('lib/sqlite-jdbc-3.54.1.0.jar'))
    }
    jar {
        dependsOn configurations.runtimeClasspath
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF'
    }
    tasks.register('regression', JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'br.goldsuite.core.CoreTest'
        jvmArgs '-ea'
    }
    // Os testes usam programas Java comuns, sem baixar um framework de testes.
    tasks.named('test') { enabled = false }
    check.dependsOn regression
}

project(':gold-auth') {
    dependencies { compileOnly project(':gold-api') }
    tasks.named('test') { enabled = false }
    tasks.register('regression', JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'br.goldsuite.auth.AuthTest'
        jvmArgs '-ea'
    }
    check.dependsOn regression
}
